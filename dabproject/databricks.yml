# This is a Declarative Automation Bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: e22f0c49-b74d-4ab8-85a2-20f6708cde16

include:
  - resources/*.yml
  - resources/*/*.yml



targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://adb-7405612238252728.8.azuredatabricks.net/
    
  prod:
    mode: production
    workspace:
      host: https://adb-7405612238252728.8.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/veertekcrux@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/veertekcrux@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    
    permissions:
      - group_name: admins
        level: CAN_MANAGE
